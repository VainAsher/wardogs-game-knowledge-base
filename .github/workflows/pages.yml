name: Publish (GitHub Pages redirect stub)

# The canonical reader site is the games wiki (https://wiki.vainasherstudios.com/en/wardogs-kb/home).
# GitHub Pages now serves only redirect-stub/: index.html sends visitors to the wiki home and 404.html maps any old
# page URL (/<repo>/<category>/<document-id>/) to the same path on the wiki. The MkDocs build is retired.
on:
  push:
    branches: [main]
    paths: ["redirect-stub/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy redirect stub
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect-stub
      - id: deployment
        uses: actions/deploy-pages@v4
