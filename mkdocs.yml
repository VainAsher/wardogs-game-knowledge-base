# Generated by scripts/build_site.py — do not edit by hand.
site_name: WARDOGS Game Knowledge Base
site_description: Evidence-based, source-cited reference for WARDOGS (Bulkhead / Team17) - gameplay, combat, vehicles, economy, maps and server administration.
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
nav:
  - Home: index.md
  - "Class 1 — Category foundations":
      - "Combat & Loadouts: Foundation": combat-loadouts/combat-loadouts-foundation.md
      - "Economy: Foundation": economy/economy-foundation.md
      - "Gameplay & Modes: Foundation": gameplay-modes/gameplay-modes-foundation.md
      - "Maps & Environment: Foundation": maps-environment/maps-environment-foundation.md
      - "Meta & Release: Foundation": meta-release/meta-release-foundation.md
      - "Technical & Servers: Foundation": technical-servers/technical-servers-foundation.md
      - "Vehicles & Outposts: Foundation": vehicles-outposts/vehicles-outposts-foundation.md
